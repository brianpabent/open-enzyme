name: Corpus integrity

# Server-side backstop for the pre-push hook (.githooks/pre-push). Runs the
# the same guards on GitHub's runners, so they fire regardless of which tool
# or clone produced the commit — including pushes from a hookless cloud
# sandbox, the GitHub API, or `git push --no-verify`. Pair with a branch
# protection rule on `main` requiring this check to make the guarantee hard.
#
#   • check-links.py   — broken relative links in the live corpus
#   • check-privacy.py — references to private sibling repos / local paths
#                        (one-way privacy gradient: private → public only)
#   • check-corpus-hygiene.py — reader contract and current-state discipline
#   • check-validation-dashboard.py — experiment registry completeness/fidelity
#   • check-lit-scan-receipt.py — compact, reproducible scan-method receipts
#   • evidence-radar.py check — current source cursors and reviewed delta state
#   • check-comp-invalidation.py — retired COMP/tree hash integrity

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      # Both checkers are stdlib-only — no dependencies to install.
      - name: Check relative links
        run: python3 scripts/check-links.py --check README.md index.md CLAUDE.md wiki

      - name: Check privacy gradient
        run: python3 scripts/check-privacy.py --check README.md index.md CLAUDE.md wiki

      - name: Check mission, current-state, and token hygiene
        run: python3 scripts/check-corpus-hygiene.py --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}" README.md index.md CLAUDE.md wiki

      - name: Check validation dashboard
        run: python3 scripts/check-validation-dashboard.py

      - name: Check literature-scan method receipts
        run: python3 scripts/check-lit-scan-receipt.py

      - name: Check evidence-radar current state
        run: python3 scripts/evidence-radar.py check

      - name: Check retired COMP invalidation ledgers
        run: python3 scripts/check-comp-invalidation.py --all
