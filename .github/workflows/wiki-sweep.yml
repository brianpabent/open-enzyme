name: Full corpus synthesis (manual)

on:
  workflow_dispatch:
    inputs:
      trigger_paths:
        description: 'Optional space-separated attention hints; blank uses every scientific change since the synthesis cursor'
        required: false
        type: string
      max_cost_usd:
        description: 'Hard cap. Default production cap is $5; any increase is explicit in run history.'
        required: false
        default: '5.00'
        type: string

permissions:
  contents: write

concurrency:
  group: full-corpus-synthesis
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      WORK_DIR: /tmp/open-enzyme-distributed-synthesis
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify propagation and computational evidence are current
        id: preflight
        env:
          EXPLICIT_PATHS: ${{ inputs.trigger_paths }}
        run: |
          set -euo pipefail
          pending_propagation=$(python3 scripts/sweep-state.py pending-propagation-paths)
          if [[ -n "$pending_propagation" ]]; then
            echo "Full synthesis requires propagation to be current. Pending:"
            printf '%s\n' "$pending_propagation"
            exit 1
          fi
          diff_base=$(python3 -c 'import json; d=json.load(open("logs/sweep-state.json")); print((d.get("last_successful_synthesis") or {}).get("coverage_commit", ""))')
          if [[ -z "$diff_base" ]]; then
            echo "Missing synthesis cursor"
            exit 1
          fi
          integrity_status=$(python3 -c 'import json; d=json.load(open("logs/sweep-state.json")); print((d.get("last_successful_synthesis") or {}).get("integrity_status", ""))')
          if [[ "$integrity_status" != "verified" ]]; then
            echo "Synthesis cursor lacks verified integrity receipts; forcing full-source recovery."
            python3 scripts/sweep-state.py pending-synthesis-paths > /tmp/synthesis-triggers.txt
          elif [[ -n "$EXPLICIT_PATHS" ]]; then
            printf '%s' "$EXPLICIT_PATHS" | tr ', ' '\n' | grep -v '^$' | sort -u > /tmp/synthesis-triggers.txt
          else
            python3 scripts/sweep-state.py pending-synthesis-paths > /tmp/synthesis-triggers.txt
          fi
          if [[ ! -s /tmp/synthesis-triggers.txt ]]; then
            echo "No scientific changes since the synthesis cursor"
            exit 1
          fi
          echo "diff_base=$diff_base" >> "$GITHUB_OUTPUT"
          echo "coverage=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run dual-read distributed synthesis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          trigger_args=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && trigger_args+=(--trigger-path "$path")
          done < /tmp/synthesis-triggers.txt
          python3 scripts/distributed-synthesis.py \
            --work-dir "$WORK_DIR" \
            --diff-base "${{ steps.preflight.outputs.diff_base }}" \
            --max-cost-usd "${{ inputs.max_cost_usd }}" \
            "${trigger_args[@]}"

      - name: Normalize and deterministically emit reviewed active items
        run: |
          set -euo pipefail
          python3 scripts/synthesis_normalize.py normalize \
            --synthesis-log "$WORK_DIR/distributed-synthesis.md" \
            --output "$WORK_DIR/normalized-synthesis.json"
          trigger_csv=$(paste -sd, /tmp/synthesis-triggers.txt)
          python3 scripts/synthesis-emit-files.py \
            --synthesis-log "$WORK_DIR/distributed-synthesis.md" \
            --normalized-manifest "$WORK_DIR/normalized-synthesis.json" \
            --reviews-file "$WORK_DIR/distributed-reviews.txt" \
            --commit-sha "${{ steps.preflight.outputs.coverage }}" \
            --diff-base "${{ steps.preflight.outputs.diff_base }}" \
            --trigger-files "$trigger_csv" \
            --synthesizer "distributed-dual-read" \
            --reviewer "openai/gpt-5.5"

      - name: Commit queue and advance only exact synthesis coverage
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synthesis/queue/
          if git diff --cached --quiet; then
            result_commit="${{ steps.preflight.outputs.coverage }}"
          else
            git commit -m "synthesis: emit reviewed distributed findings [skip-knowledge-update]"
            result_commit=$(git rev-parse HEAD)
          fi
          trigger_csv=$(paste -sd, /tmp/synthesis-triggers.txt)
          receipt_hash=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["coverage_receipt_sha256"])' "$WORK_DIR/coverage-receipt.json")
          corpus_hash=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["corpus_sha256"])' "$WORK_DIR/coverage-receipt.json")
          cost=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cost"]["actual_usd"])' "$WORK_DIR/coverage-receipt.json")
          python3 scripts/sweep-state.py update-success \
            --commit "$result_commit" \
            --synthesis-log "$WORK_DIR/distributed-synthesis.md" \
            --normalized-manifest "$WORK_DIR/normalized-synthesis.json" \
            --expected-diff-base "${{ steps.preflight.outputs.diff_base }}" \
            --trigger-files "$trigger_csv" --run-id "${{ github.run_id }}" \
            --coverage-receipt-sha256 "$receipt_hash" \
            --corpus-sha256 "$corpus_hash" --cost-usd "$cost"
          git add logs/sweep-state.json
          git commit -m "synthesis-state: cover ${{ steps.preflight.outputs.coverage }} [skip-knowledge-update]"

      - name: Push successful synthesis batch
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Retain exact recovery artifacts temporarily
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-synthesis-${{ github.run_id }}
          path: /tmp/open-enzyme-distributed-synthesis
          retention-days: 7
          if-no-files-found: warn
